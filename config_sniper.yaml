# Memecoin Sniper Bot Configuration

rpc:
  url: "https://api.mainnet-beta.solana.com"
  ws_url: "wss://api.mainnet-beta.solana.com"
  backup_url: "https://mainnet.helius-rpc.com"

wallet:
  path: "./wallet.json"

# Sniper-specific settings
sniper:
  max_position_sol: 0.05           # Max SOL per snipe (start small!)
  min_liquidity_sol: 5.0           # Minimum pool liquidity
  max_buy_tax: 5.0                 # Max 5% buy tax
  max_sell_tax: 5.0                # Max 5% sell tax
  profit_target_percent: 200.0     # Take profit at 200% (3x)
  stop_loss_percent: 50.0          # Stop loss at -50%
  max_market_cap: 100000.0         # Max $100k market cap
  scan_interval_ms: 250            # Scan every 250ms
  
  # Safety filters
  max_dev_percentage: 30.0         # Max 30% dev holdings
  min_holders: 10                  # Minimum number of holders
  max_age_minutes: 5               # Only snipe tokens < 5 min old
  
  # Advanced settings
  use_jupiter: true                # Use Jupiter for swaps
  priority_fee_lamports: 50000     # Higher priority for speed
  max_slippage_percent: 10.0       # Higher slippage for new tokens
  
# Target DEXes
dex:
  raydium:
    enabled: true
    program_id: "675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8"
    api_url: "https://api.raydium.io/v2/sdk/liquidity/mainnet.json"
  
  orca:
    enabled: false  # Start with Raydium only
    program_id: "whirLbMiicVdio4qvUfM5KAg6Ct8VwpYzGff3uctyCc"

# Risk management
risk:
  max_daily_loss_sol: 0.5          # Max 0.5 SOL loss per day
  max_positions: 3                 # Max 3 concurrent positions
  position_timeout_minutes: 60     # Auto-sell after 1 hour
  
# Monitoring
monitoring:
  log_level: "info"
  db_path: "./sniper_trades.db"
  scan_frequency_ms: 250
  
# Discord alerts for sniper
discord:
  webhook_url: "https://discordapp.com/api/webhooks/1407094459493122158/9Ju35aOQQk5MrqRe4Qj4hx6Y3lPmuq7zfswplBqtB34WBJ-2fXnRSq8C1kaP0VCY8nqG"
  enabled: true
  alert_on_snipe: true             # Alert when sniping new token
  alert_on_profit: true            # Alert on profit target hit
  alert_on_loss: true              # Alert on stop loss hit
  alert_on_new_token: false        # Don't spam on every new token

# Honeypot detection APIs
security:
  honeypot_api: "https://api.honeypot.is/v2/IsHoneypot"
  rugcheck_api: "https://api.rugcheck.xyz/v1/tokens"
  enable_safety_checks: true
  
# Token filters
filters:
  # Blacklisted tokens (known scams)
  blacklist:
    - "11111111111111111111111111111111"  # System program
    
  # Required in token name/symbol (optional)
  whitelist_keywords: []
  
  # Forbidden in token name/symbol
  blacklist_keywords:
    - "test"
    - "fake" 
    - "scam"
    - "rug"
    - "honeypot"
