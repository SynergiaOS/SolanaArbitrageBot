# CodeRabbit Configuration for Solana Arbitrage Bot
# https://docs.coderabbit.ai/configuration

# Review settings
reviews:
  # Enable automatic reviews on PRs
  auto_review: true
  
  # Review all file types
  include_patterns:
    - "**/*.rs"
    - "**/*.toml"
    - "**/*.yml"
    - "**/*.yaml"
    - "**/*.md"
    - "**/*.sh"
    - "**/*.js"
  
  # Exclude certain files from review
  exclude_patterns:
    - "target/**"
    - "**/*.lock"
    - ".git/**"
    - "**/.DS_Store"
  
  # Review depth
  max_files_per_review: 50
  max_lines_per_file: 1000

# Language-specific settings
language_settings:
  rust:
    # Focus on Rust best practices
    focus_areas:
      - "error_handling"
      - "memory_safety"
      - "performance"
      - "security"
      - "async_patterns"
    
    # Rust-specific rules
    rules:
      - name: "avoid_unwrap"
        severity: "high"
        description: "Avoid using unwrap() in production code"
        pattern: "\\.unwrap\\(\\)"
      
      - name: "proper_error_handling"
        severity: "medium"
        description: "Use Result<T, E> for error handling"
        pattern: "fn.*->.*Result"
      
      - name: "async_best_practices"
        severity: "medium"
        description: "Follow async/await best practices"
        pattern: "async fn|await"

# Solana/DeFi specific rules
custom_rules:
  # Security-focused rules for DeFi
  - name: "private_key_security"
    severity: "critical"
    description: "Ensure private keys are handled securely"
    patterns:
      - "private_key"
      - "secret_key"
      - "wallet_key"
    message: "🔐 Private key detected - ensure secure handling and never commit to repo"
  
  - name: "amount_validation"
    severity: "high"
    description: "Validate all financial amounts"
    patterns:
      - "amount.*unwrap"
      - "balance.*unwrap"
      - "price.*unwrap"
    message: "💰 Financial amount without proper validation - use safe error handling"
  
  - name: "rpc_rate_limiting"
    severity: "medium"
    description: "Ensure RPC calls are rate limited"
    patterns:
      - "rpc_client\\."
      - "get_balance"
      - "send_transaction"
    message: "🌐 RPC call detected - ensure proper rate limiting and error handling"
  
  - name: "transaction_simulation"
    severity: "medium"
    description: "Simulate transactions before execution"
    patterns:
      - "send_transaction"
      - "execute_trade"
    message: "🧪 Transaction execution - consider simulation first"

# Comment settings
comments:
  # Enable inline comments
  inline_comments: true
  
  # Comment style
  style: "constructive"
  
  # Focus areas for comments
  focus_areas:
    - "security_vulnerabilities"
    - "performance_issues"
    - "code_quality"
    - "best_practices"
    - "potential_bugs"
  
  # Custom comment templates
  templates:
    security: "🔐 **Security Concern**: {issue_description}\n\n**Recommendation**: {recommendation}"
    performance: "⚡ **Performance**: {issue_description}\n\n**Suggestion**: {suggestion}"
    bug: "🐛 **Potential Bug**: {issue_description}\n\n**Fix**: {fix_suggestion}"
    improvement: "✨ **Improvement**: {issue_description}\n\n**Enhancement**: {enhancement}"

# Integration settings
integrations:
  # GitHub integration
  github:
    # Auto-approve simple changes
    auto_approve_patterns:
      - "docs/**/*.md"
      - "README.md"
      - "*.yml"
    
    # Require review for critical files
    require_review_patterns:
      - "src/**/*.rs"
      - "Cargo.toml"
      - ".github/workflows/**"
    
    # Labels to add based on review
    labels:
      security_issue: "🔐 security"
      performance_issue: "⚡ performance"
      bug_found: "🐛 bug"
      needs_improvement: "✨ enhancement"

# Notification settings
notifications:
  # Notify on critical issues
  critical_issues: true
  
  # Summary reports
  daily_summary: false
  weekly_summary: true
  
  # Channels (if integrated with Slack/Discord)
  channels:
    critical: "#security-alerts"
    general: "#code-reviews"

# Learning and adaptation
learning:
  # Learn from feedback
  adapt_to_feedback: true
  
  # Project-specific learning
  project_context:
    domain: "DeFi/Blockchain"
    language: "Rust"
    framework: "Solana"
    focus: "Security and Performance"
  
  # Custom knowledge base
  knowledge_base:
    - "Solana programming best practices"
    - "DeFi security patterns"
    - "Rust async programming"
    - "Financial calculation precision"
    - "Hardware wallet integration"

# Quality gates
quality_gates:
  # Minimum code quality score
  min_quality_score: 8.0
  
  # Security requirements
  security:
    no_critical_vulnerabilities: true
    no_hardcoded_secrets: true
    proper_error_handling: true
  
  # Performance requirements
  performance:
    no_blocking_calls_in_async: true
    efficient_memory_usage: true
    proper_resource_cleanup: true
