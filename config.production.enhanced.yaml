# 🚀 Enhanced Production Configuration - Solana Arbitrage Bot
# Optimized for $50-100 starting capital with comprehensive risk management

rpc:
  # Primary RPC (use paid service for reliability)
  url: "https://solana-mainnet.g.alchemy.com/v2/YOUR_API_KEY"
  ws_url: "wss://solana-mainnet.g.alchemy.com/v2/YOUR_API_KEY"
  
  # Backup RPC for failover
  backup_url: "https://api.mainnet-beta.solana.com"
  backup_ws_url: "wss://api.mainnet-beta.solana.com"
  
  # Connection settings
  timeout_seconds: 30
  max_retries: 3
  retry_delay_ms: 1000

wallet:
  # Production wallet (use hardware wallet for security)
  path: "./wallet.production.json"
  use_ledger: true
  ledger_path: "44'/501'/0'/0'"
  
  # Hot wallet limits (keep minimal funds)
  max_hot_wallet_sol: 10.0
  auto_refill_threshold: 2.0

dex:
  raydium:
    program_id: "675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8"
    sol_usdc_pool: "58oQChx4yWmvKdwLLZzBi4ChoCc2fqCUWBkwMihLYQo2"
    fee_percent: 0.25
    min_liquidity_sol: 1000.0
    
  orca:
    program_id: "whirLbMiicVdio4qvUfM5KAg6Ct8VwpYzGff3uctyCc"
    sol_usdc_pool: "HJPjoWUrhoZzkNfRpHuieeFk9WcZWjwy6PBjZ81ngndJ"
    fee_percent: 0.30
    min_liquidity_sol: 1000.0

limits:
  # Conservative position sizing for $50-100 capital
  max_position_sol: 2.0          # Max $300 per trade at $150/SOL
  min_profit_percent: 0.5        # Higher threshold for production
  min_profit_usd: 1.0           # Minimum $1 profit to execute
  max_slippage_percent: 0.3     # Tighter slippage control
  
  # Daily risk limits
  max_daily_loss_usd: 10.0      # 10-20% of $50-100 capital
  max_daily_trades: 50          # Reasonable limit
  max_consecutive_losses: 3     # Stop after 3 losses
  
  # Position sizing rules
  position_size_percent: 15.0   # 15% of capital per trade
  max_position_percent: 20.0    # Never exceed 20%
  
  # Performance thresholds
  min_success_rate: 60.0        # Stop if success rate drops below 60%
  max_drawdown_percent: 15.0    # Emergency stop at 15% drawdown

execution:
  # Aggressive settings for speed
  priority_fee_lamports: 50000   # Higher priority for production
  simulation_required: false     # Skip simulation for speed
  max_retries: 2                # Quick retries only
  timeout_seconds: 5            # Fast timeout
  
  # Confirmation settings
  commitment: "confirmed"        # Balance speed vs safety
  skip_preflight: true          # Skip for speed
  max_retries_confirmation: 5   # Ensure confirmation

monitoring:
  # Performance tracking
  enable_metrics: true
  metrics_interval_seconds: 60
  log_level: "info"
  
  # Health checks
  health_check_interval_seconds: 30
  rpc_health_check: true
  wallet_balance_check: true
  
  # Alerting thresholds
  alert_on_error_rate: 5.0      # Alert if >5% error rate
  alert_on_low_balance: 1.0     # Alert if <1 SOL
  alert_on_high_slippage: 0.5   # Alert if >0.5% slippage

safety:
  # Emergency stops
  enable_circuit_breaker: true
  circuit_breaker_loss_percent: 10.0
  circuit_breaker_error_count: 10
  
  # Market condition checks
  check_market_volatility: true
  max_volatility_percent: 20.0
  min_market_hours_utc: 13      # Start during US market hours
  max_market_hours_utc: 21      # Stop after US market close
  
  # Operational safety
  require_manual_restart: true   # Manual restart after stops
  backup_wallet_check: true     # Verify backup wallet exists
  daily_report_required: true   # Generate daily reports

discord:
  # Production alerts
  webhook_url: "YOUR_DISCORD_WEBHOOK_URL"
  enable_alerts: true
  
  # Alert types
  alert_on_trades: true
  alert_on_profits: true
  alert_on_losses: true
  alert_on_errors: true
  alert_on_stops: true
  
  # Alert thresholds
  min_profit_alert: 5.0         # Alert on profits >$5
  min_loss_alert: 2.0           # Alert on losses >$2
  
  # Rate limiting
  max_alerts_per_hour: 20
  cooldown_minutes: 5

web:
  # Production dashboard
  enable: true
  host: "127.0.0.1"             # Localhost only for security
  port: 8080
  
  # Authentication
  require_auth: true
  auth_token: "YOUR_SECURE_TOKEN_HERE"
  session_timeout_hours: 24
  
  # Features
  enable_trading_controls: true
  enable_real_time_charts: true
  enable_performance_metrics: true
  
  # Security
  enable_https: false           # Use reverse proxy for HTTPS
  cors_origins: ["http://localhost:3000"]
  rate_limit_requests_per_minute: 60

database:
  # Production database
  url: "sqlite:./data/production.db"
  max_connections: 10
  connection_timeout_seconds: 30
  
  # Data retention
  keep_trades_days: 365
  keep_metrics_days: 90
  keep_logs_days: 30
  
  # Backup
  auto_backup: true
  backup_interval_hours: 6
  backup_retention_days: 30

logging:
  # Production logging
  level: "info"
  file: "./logs/production.log"
  max_file_size_mb: 100
  max_files: 10
  
  # Log rotation
  rotate_daily: true
  compress_old_logs: true
  
  # Structured logging
  format: "json"
  include_timestamps: true
  include_thread_id: true

# Environment-specific overrides
environment: "production"
debug_mode: false
dry_run: false

# Feature flags
features:
  enable_sniper: false          # Disable sniper for now
  enable_advanced_analytics: true
  enable_ml_scoring: false      # Simple scoring for now
  enable_multi_dex: true
  enable_auto_rebalancing: true

# Performance tuning
performance:
  calculator_threads: 4
  monitor_update_interval_ms: 100
  price_cache_duration_ms: 50
  max_concurrent_requests: 10
  
  # Memory management
  max_memory_usage_mb: 1024
  gc_interval_seconds: 300
  
  # Network optimization
  connection_pool_size: 20
  keep_alive_timeout_seconds: 30
  tcp_nodelay: true
