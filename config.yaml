# Memecoin Sniper Bot Configuration - MAINNET
# Czysta, bezpieczna konfiguracja dedykowana wyłącznie dla sniper bota
# Sekcje: rpc, wallet, sniper, safety, risk, monitoring, discord


rpc:
  url: "https://api.mainnet-beta.solana.com"
  ws_url: "wss://api.mainnet-beta.solana.com"
  backup_url: "https://mainnet.helius-rpc.com"

wallet:
  path: "./wallet.json"                            # Ścieżka do keypair (JSON). Nie commituj do repo!

# --- Ustawienia Sniper Bota (handel i wykonanie) ---
sniper:
  max_position_sol: 0.02                           # Maks. SOL na jeden snipe (bezpiecznie na start)
  scan_interval_ms: 250                             # Częstotliwość skanowania (ms)
  max_slippage_bps: 150                             # Maks. slippage 1.5% (150 bps)
  priority_fee_lamports: 100000                     # Opłata priorytetowa (przyspiesza transakcje)
  profit_target_percent: 200.0                      # Take profit przy +200% (x3)
  stop_loss_percent: 50.0                           # Stop loss przy -50%

# --- Zasady bezpieczeństwa (filtry i weryfikacje) ---
safety:
  enable_safety_checks: true                        # Globalny włącznik filtrów bezpieczeństwa
  min_liquidity_sol: 3.0                            # Minimalna płynność w poolu (SOL)
  max_market_cap_usd: 100000.0                      # Maks. market cap tokena w USD
  max_buy_tax_percent: 5.0                          # Maks. podatek kupna (procent)
  max_sell_tax_percent: 5.0                         # Maks. podatek sprzedaży (procent)
  max_dev_percentage: 30.0                          # Maks. % tokenów w rękach deva
  min_holders: 10                                   # Min. liczba holderów
  max_token_age_minutes: 8                          # Snajpuj tylko tokeny < 8 min od startu
  blacklist_keywords: ["test", "fake", "scam", "rug", "honeypot"]  # Słowa kluczowe do odrzucenia
  blacklist_mints: []                                # Czarna lista mintów (opcjonalnie)
  blacklisted_creators:
    - "Czv5xzTo1jcv4Z5w5Wg3J5q1ML5X3D2tTjv1Jx1Jx1Jx1"
  honeypot_api: "https://api.honeypot.is/v2/IsHoneypot"  # API honeypot
  rugcheck_api: "https://api.rugcheck.xyz/v1/tokens"     # API rugcheck

# --- Zarządzanie ryzykiem portfela ---
risk:
  max_daily_loss_sol: 0.5                           # Maks. dzienna strata (SOL)
  max_open_positions: 3                             # Maks. liczba jednoczesnych pozycji
  position_timeout_minutes: 60                      # Auto-sell po 60 minutach


# --- Monitoring i logowanie ---
monitoring:
  log_level: "info"                                 # Poziom logów: trace|debug|info|warn|error
  db_path: "./sniper_trades.db"                    # Ścieżka do lokalnej bazy danych (opcjonalnie)

# --- Powiadomienia Discord ---
discord:
  enabled: true
  webhook_url: "https://discordapp.com/api/webhooks/1407094459493122158/9Ju35aOQQk5MrqRe4Qj4hx6Y3lPmuq7zfswplBqtB34WBJ-2fXnRSq8C1kaP0VCY8nqG"
  alert_on_snipe: true                              # Powiadomienie przy nowym snajpie
  alert_on_profit: true                             # Powiadomienie przy take profit
  alert_on_loss: true                               # Powiadomienie przy stop loss
  alert_on_error: true                              # Błędy krytyczne
  alert_on_startup: true                            # Start bota
