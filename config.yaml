# Solana Arbitrage Bot Configuration
# Last updated: 2025-01-01

# RPC Configuration
rpc:
  primary:
    url: "https://api.mainnet-beta.solana.com"
    ws_url: "wss://api.mainnet-beta.solana.com"
  backup:
    url: "https://solana-mainnet.g.alchemy.com/v2/YOUR_API_KEY"
    ws_url: "wss://solana-mainnet.g.alchemy.com/v2/YOUR_API_KEY"
  helius:  # Premium RPC for low latency
    url: "https://mainnet.helius-rpc.com/?api-key=YOUR_API_KEY"
  
# Wallet Configuration  
wallet:
  path: "./wallet.json"
  encryption_key: "${WALLET_ENCRYPTION_KEY}"  # From env
  
# DEX Configuration
dex:
  raydium:
    program_id: "675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8"
    ws_endpoint: "wss://api.raydium.io/v2/ws"
    api_endpoint: "https://api.raydium.io/v2"
  orca:
    program_id: "9W959DqEETiGZocYWCQPaJ6sBmUzgfxXfqGeTEdp3aQP"
    ws_endpoint: "wss://api.orca.so/v1/ws"
    whirlpool_program: "whirLbMiicVdio4qvUfM5KAg6Ct8VwpYzGff3uctyCc"
  meteora:
    program_id: "LBUZKhRxPF3XUpBCjp4YzTKgLccjZhTSDM9YuVaPwxo"
    api_endpoint: "https://dlmm-api.meteora.ag"
  jupiter:
    api_url: "https://quote-api.jup.ag/v6"
    price_api: "https://price.jup.ag/v4"
  phoenix:
    program_id: "PhoeNiXZ8ByJGLkxNfZRnkUfjvmuYqLR89jjFHGqdXY"
  lifinity:
    program_id: "EewxydAPCCVuNEyrVN68PuSYdQ7wKn27V9Gjeoi8dy3S"
  pump_fun:
    program_id: "6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwT6P"
    api_endpoint: "https://frontend-api.pump.fun"
    
# Trading Limits & Risk Management
limits:
  # Capital management
  max_position_sol: 100
  micro_capital_mode:  # For 50-100 USD
    enabled: true
    max_position_usd: 30  # Max 30% of capital per trade
    min_capital_usd: 50
    max_capital_usd: 100
    
  # Profit thresholds  
  min_profit_percent: 0.3
  micro_min_profit_usd: 0.50
  
  # Risk limits
  max_slippage_percent: 0.5
  max_daily_loss_usd: 50
  max_priority_fee_cap_lamports: 50000
  stop_loss_percent: 10
  
  # Trading limits
  max_daily_trades: 100
  max_concurrent_positions: 5
  
# Sniper Configuration
sniper:
  enabled: true
  mode: "aggressive"  # aggressive, moderate, safe
  
  # Pool detection
  min_liquidity_usd: 5000
  max_position_size_usd: 50
  
  # Profit targets
  auto_sell_profit_percent: 20
  trailing_stop_percent: 5
  
  # Safety checks
  rug_detection:
    enabled: true
    min_safety_score: 0.7
    min_locked_liquidity_percent: 50
    max_top_holder_percent: 10
    min_holder_count: 50
    check_socials: true
    
  # Token filters
  token_filters:
    blacklist_mints: []  # Add known scams
    whitelist_mints: []  # Add trusted tokens
    min_market_cap_usd: 1000
    max_market_cap_usd: 10000000
    
# Strategy Configuration
strategies:
  # Arbitrage
  arbitrage:
    enabled: true
    min_spread_percent: 0.5
    use_flash_loans: true
    triangle_arbitrage: true
    
  # Sniping  
  sniping:
    enabled: true
    monitor_new_pairs: true
    auto_buy_score_threshold: 0.8
    
  # MEV Protection
  mev_protection:
    use_jito: true
    use_private_mempool: true
    bundle_transactions: true
    
  # Market Making
  market_making:
    enabled: false
    spread_percent: 0.2
    
# GEPA Evolution Configuration  
gepa:
  enabled: true
  population_size: 50
  generations_per_evolution: 100
  mutation_rate: 0.1
  crossover_rate: 0.7
  elite_percentage: 0.1
  evolution_schedule: "0 2 * * SUN"  # Weekly on Sunday 2AM
  
# Web Server Configuration
web:
  enabled: true
  host: "0.0.0.0"
  port: 8080
  
  # CORS
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:3001"
    
  # Authentication
  admin_token: "${ADMIN_TOKEN}"  # From env
  config_token: "${CONFIG_TOKEN}"
  status_token: "${STATUS_TOKEN}"
  
  # Security
  allowlist_control_ips:
    - "127.0.0.1/32"
    - "192.168.1.0/24"
  
  # Rate limiting (requests per minute)
  rate_limit:
    global: 100
    control: 10
    status: 60
    
# Monitoring & Alerts
monitoring:
  prometheus:
    enabled: true
    port: 9090
    
  alerts:
    telegram:
      enabled: true
      bot_token: "${TELEGRAM_BOT_TOKEN}"
      chat_id: "${TELEGRAM_CHAT_ID}"
      
    thresholds:
      min_daily_profit_usd: 10
      max_slippage_alert: 2.0
      mev_attack_threshold: 0.3
      
  logging:
    level: "info"  # debug, info, warn, error
    file: "./logs/bot.log"
    max_size_mb: 100
    max_backups: 10
    
# Database Configuration
database:
  postgres:
    enabled: true
    url: "postgresql://user:password@localhost/solana_bot"
    max_connections: 20
    
  sqlite:
    enabled: false
    path: "./data/trades.db"
    
# Flash Loan Configuration
flash_loans:
  enabled: true
  providers:
    solend:
      enabled: true
      program_id: "So1endDq2YkqhipRh3WViPa8hdiSpxWy6z3Z6tMCpAo"
      max_borrow_sol: 1000
      
    port_finance:
      enabled: false
      program_id: "Port7uDYB3wk6GJAw4KT1WpTeMtSu9bTcChBHkX2LfR"
      
# Performance Tuning
performance:
  connection_pool_size: 10
  request_timeout_ms: 5000
  transaction_retry_count: 3
  parallel_requests: true
  cache_ttl_seconds: 60
  
# Environment
environment: "production"  # development, staging, production
