name: 🚀 Solana Arbitrage Bot CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # 🧪 Testing and Quality Checks
  test:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta]
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🦀 Setup Rust ${{ matrix.rust }}
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy
        
    - name: 📦 Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        
    - name: 🔍 Check formatting
      run: cargo fmt --all -- --check

    - name: 📋 Clippy linting
      run: cargo clippy --all-targets --all-features -- -D warnings -A unused-imports -A unused-variables -A dead-code -A unused-mut -A deprecated -A clippy::vec-init-then-push -A clippy::too-many-arguments -A clippy::option-as-ref-deref -A clippy::match-single-binding -A clippy::needless-return -A clippy::needless-borrow -A clippy::manual-strip
      
    - name: 🧪 Run tests
      run: cargo test --verbose --all-features
      
    - name: 🏗️ Build release
      run: cargo build --release --verbose

  # 🔐 Security Scanning
  security:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🦀 Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        
    - name: 🔍 Cargo Audit
      uses: rustsec/audit-check@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    # Snyk security scan disabled - requires SNYK_TOKEN secret
    # - name: 🛡️ Snyk Security Scan
    #   uses: snyk/actions/rust@master
    #   env:
    #     SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    #   with:
    #     args: --severity-threshold=high
    #
    # - name: 📊 Upload Snyk results to GitHub
    #   uses: github/codeql-action/upload-sarif@v2
    #   if: always()
    #   with:
    #     sarif_file: snyk.sarif

  # 📊 Code Quality
  quality:
    name: 📊 Code Quality
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: 🦀 Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: llvm-tools-preview
        
    - name: 📦 Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov
      
    - name: 📈 Generate code coverage
      run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

    - name: 📤 Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: lcov.info
        fail_ci_if_error: false
      if: always()

  # 🏷️ Release Management
  release:
    name: 🏷️ Release
    runs-on: ubuntu-latest
    needs: [test, security, quality]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: 🦀 Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        
    - name: 🏗️ Build release artifacts
      run: |
        cargo build --release
        strip target/release/solana-arbitrage-bot
        
    - name: 📦 Create release archive
      run: |
        mkdir -p release
        cp target/release/solana-arbitrage-bot release/
        cp README.md release/
        cp config.yaml release/config.example.yaml
        cp setup_ledger_ubuntu.sh release/
        tar -czf solana-arbitrage-bot-linux-x64.tar.gz -C release .
        
    - name: 🏷️ Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          solana-arbitrage-bot-linux-x64.tar.gz
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 🐳 Docker Build
  docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [test, security]
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: 🔑 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 🏗️ Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # 🚨 Notifications
  notify:
    name: 🚨 Notifications
    runs-on: ubuntu-latest
    needs: [test, security, quality]
    if: always()
    
    steps:
    - name: 📧 Notify on success
      if: ${{ needs.test.result == 'success' && needs.security.result == 'success' && needs.quality.result == 'success' }}
      run: |
        echo "✅ All checks passed! Bot is ready for deployment."
        
    - name: 🚨 Notify on failure
      if: ${{ needs.test.result == 'failure' || needs.security.result == 'failure' || needs.quality.result == 'failure' }}
      run: |
        echo "❌ Some checks failed! Please review the logs."
        exit 1
