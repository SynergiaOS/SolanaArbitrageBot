[package]
name = "solana-arbitrage-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"

# Solana
solana-client = "2.0"
solana-sdk = "2.0"
solana-transaction-status = "2.0"
solana-account-decoder = "2.0"
solana-program-pack = "2.0"
spl-token = "6.0"



# WebSocket
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }

# HTTP Client
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
bincode = "1.3"
base64 = "0.21"

# SPL Token (moved to Solana section)

# Ledger Hardware Wallet Support
solana-remote-wallet = "2.3.6"
hidapi = "2.6.1"

# Utils
rust_decimal = { version = "1.36", features = ["serde-with-float"] }
rust_decimal_macros = "1.36"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
rand = "0.8"
futures-util = "0.3"
regex = "1.0"
hex = "0.4.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
sha2 = "0.10.0"
shellexpand = "3.0"

# Enhanced components dependencies
futures = "0.3"

# Sniper bot dependencies
tungstenite = "0.20"
url = "2.4"

# Database
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }

# Web Server
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "auth", "fs", "timeout"] }

# Config
config = "0.14"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3.1"

[[bin]]
name = "demo-discord"
path = "demo_discord.rs"

[[bin]]
name = "sniper"
path = "src/bin/sniper.rs"

[[bin]]
name = "historical_backtest"
path = "src/bin/historical_backtest.rs"

[[bin]]
name = "enhanced_arbitrage_bot"
path = "src/bin/enhanced_arbitrage_bot.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
http-body-util = "0.1"
