[package]
name = "solana-arbitrage-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"

# Solana
solana-client = "2.0"
solana-sdk = "2.0"
solana-transaction-status = "2.0"



# WebSocket
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }

# HTTP Client
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
bincode = "1.3"
base64 = "0.21"

# SPL Token
spl-token = "4.0"

# Ledger Hardware Wallet Support
solana-remote-wallet = "2.3.6"
hidapi = "2.6.1"

# Utils
rust_decimal = "1.36"
rust_decimal_macros = "1.36"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
futures-util = "0.3"
regex = "1.0"
hex = "0.4.0"
sha2 = "0.10.0"
shellexpand = "3.0"
uuid = { version = "1.0", features = ["v4"] }

# Database
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# Config
config = "0.14"
clap = { version = "4.5", features = ["derive"] }

[[bin]]
name = "demo-discord"
path = "demo_discord.rs"

[[bin]]
name = "sniper"
path = "src/bin/sniper.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
