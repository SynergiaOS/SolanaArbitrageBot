[package]
name = "solana-arbitrage-bot"
version = "1.0.0"
edition = "2021"
authors = ["Marcin <marcin@example.com>"]
description = "Advanced Solana arbitrage bot with sniper capabilities"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
futures-util = "0.3"
async-trait = "0.1"

# Solana SDK
solana-client = "2.0"
solana-sdk = "2.0"
solana-transaction-status = "2.0"
spl-token = "6.0"
spl-associated-token-account = "5.0"

# WebSocket
tokio-tungstenite = "0.24"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
bincode = "1.3"
borsh = "1.5"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
postgres = "0.19"
tokio-postgres = "0.7"
deadpool-postgres = "0.14"

# Web server
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "limit", "set-header", "compression-gzip"] }
governor = "0.6"  # Rate limiting

# Utilities
dashmap = "6.0"
ipnet = "2.10"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
prometheus = "0.13"
rand = "0.8"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"

# Crypto
ring = "0.17"
base64 = "0.22"
hex = "0.4"

# Math
nalgebra = "0.33"
statrs = "0.17"
rust_decimal = "1.36"

# Configuration
config = "0.14"
dotenv = "0.15"

# Anchor (for program interaction)
anchor-client = "0.30"
anchor-lang = "0.30"

[dev-dependencies]
mockito = "1.4"
proptest = "1.5"

[features]
default = ["monitor"]
monitor = []
full = ["monitor", "web", "sniper", "gepa"]
web = []
sniper = []
gepa = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "solana-arbitrage-bot"
path = "src/main.rs"

[[bin]]
name = "gepa-optimizer"
path = "src/bin/gepa_optimizer.rs"
