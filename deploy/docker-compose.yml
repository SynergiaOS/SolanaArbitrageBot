version: "3.9"
services:
  solana-arb-bot:
    image: rust:1.79
    working_dir: /app
    volumes:
      - ./:/app
    command: bash -lc "cargo run --release -- --config ./config.production.yaml"
    environment:
      - RUST_LOG=info
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - DISCORD_ENABLED=${DISCORD_ENABLED}
      - BOT__WEB__AUTH_TOKEN=${BOT__WEB__AUTH_TOKEN}
      - BOT__RPC__URL=${BOT__RPC__URL}
      - BOT__RPC__WS_URL=${BOT__RPC__WS_URL}
      - BOT__WEB__DATABASE_PATH=/app/data/dashboard.db
    ports:
      - "3001:3001"
    restart: unless-stopped
    # For production, build a minimal binary and copy into a slim image
    # This setup uses dev image for convenience

