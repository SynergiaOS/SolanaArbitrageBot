# Smoke Test Configuration - Safe E2E Testing
# This config is designed for local testing without real transactions or Discord alerts

rpc:
  url: "https://api.mainnet-beta.solana.com"
  ws_url: "wss://api.mainnet-beta.solana.com"

wallet:
  path: "./wallet.json"  # Using existing test wallet
  use_ledger: false

dex:
  raydium:
    program_id: "675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8"
    sol_usdc_pool: "58oQChx4yWmvKdwLLZzBi4ChoCc2fqCUWBkwMihLYQo2"
  orca:
    program_id: "whirLbMiicVdio4qvUfM5KAg6Ct8VwpYzGff3uctyCc"
    sol_usdc_pool: "HJPjoWUrhoZzkNfRpHuieeFk9WcZWjwy6PBjZ81ngndJ"

limits:
  max_position_sol: 0.01  # Very small for safety
  min_profit_percent: 0.5
  min_profit_usd: 0.05
  max_slippage_percent: 0.5
  max_daily_loss_usd: 1.0
  max_daily_trades: 5

execution:
  priority_fee_lamports: 5000
  simulation_required: true
  max_retries: 2

# Web dashboard enabled for testing
web:
  enabled: true
  host: "127.0.0.1"
  port: 3002
  auth_token: "smoke-test-token"
  database_path: "./data/smoke_test.db"
  api_keys:
    admin_key: "admin-smoke-test"
    config_key: "config-smoke-test"
    status_key: "status-smoke-test"
  control_ip_allowlist:
    - "127.0.0.1/32"
    - "::1/128"

# Discord disabled for smoke test
discord:
  enabled: false
  webhook_url: ""
